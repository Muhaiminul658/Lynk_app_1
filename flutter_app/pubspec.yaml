name: lynk_flutter
description: "Lynk — Social, Creator & Education Platform (Flutter Android Native App)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.1
  firebase_core: ^2.30.0
  firebase_messaging: ^14.8.0
  flutter_local_notifications: ^17.1.0
  permission_handler: ^11.3.1
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
